name: CI
on:
  # Validate integration and release branches on pushes and pull requests.
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
    - name: python-3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12.10"
    - name: install dependencies
      run: |
        uv sync --all-extras
    - name: linting checks
      run: |
        uv run ruff check .
    - name: unit tests
      run: |
        uv run pytest --cov=astfnet
    - name: type checking
      run: |
        uv run ty check astfnet/
